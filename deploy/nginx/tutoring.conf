# nginx site for the live demo at tutoring.joaoabreu.dev, behind the Cloudflare proxy (Full (strict)).
# Lives at /etc/nginx/sites-available/tutoring, enabled by a symlink in sites-enabled/.
# Same VM and Origin certificate (*.joaoabreu.dev) as the portfolio; see deploy/README.md.

# Per-visitor limits keyed by the address Cloudflare forwards (80/443 only accept Cloudflare).
limit_req_zone $http_cf_connecting_ip zone=tutoring_login:10m rate=10r/m;
limit_req_zone $http_cf_connecting_ip zone=tutoring_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name tutoring.joaoabreu.dev;
    server_tokens off;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tutoring.joaoabreu.dev;

    ssl_certificate     /etc/ssl/cloudflare/joaoabreu.dev.pem;
    ssl_certificate_key /etc/ssl/cloudflare/joaoabreu.dev.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/tutoring;
    index index.html;

    server_tokens off;
    absolute_redirect off;
    client_max_body_size 64k;

    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    limit_req_status 429;

    location = /api/auth/login {
        limit_req zone=tutoring_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8090/auth/login;
        include /etc/nginx/snippets/tutoring-proxy.conf;
    }

    location /api/ {
        limit_req zone=tutoring_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8090/;
        include /etc/nginx/snippets/tutoring-proxy.conf;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
