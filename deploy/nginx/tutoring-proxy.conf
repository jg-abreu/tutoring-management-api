# Shared proxy settings for the demo API. Lives at /etc/nginx/snippets/tutoring-proxy.conf.
# The API reads X-Forwarded-* (SERVER_FORWARD_HEADERS_STRATEGY=NATIVE), so it sees the browser's
# https://tutoring.joaoabreu.dev origin as its own and same-origin requests pass the CORS check.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $http_cf_connecting_ip;
proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port 443;
proxy_set_header Forwarded "";
proxy_connect_timeout 5s;
proxy_read_timeout 30s;
