spring.application.name=tutoring-management-system
# Local development: the PostgreSQL from docker compose (docker compose up -d db), with the same
# development-only credentials as docker-compose.yml. Servers run with SPRING_PROFILES_ACTIVE=prod.
spring.datasource.url=jdbc:postgresql://localhost:5433/tutoring
spring.datasource.username=tutoring
spring.datasource.password=tutoring
spring.jpa.hibernate.ddl-auto=validate
# Development-only signing key; the prod profile requires JWT_SECRET
security.jwt.secret=local-development-secret-not-for-production
security.jwt.expiration=2h
